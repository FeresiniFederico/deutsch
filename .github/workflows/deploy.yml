name: Deploy Single Bot File via SCP

on:
  push:
    branches: [ main ] # O il branch che preferisci

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Configura la chiave SSH
    - name: Setup SSH Key
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_KEY }}

    # 2. Aggiungi il server agli host conosciuti
    - name: Add remote to known_hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

    # 3. Copia solo il file bot.py
    - name: Copy bot.py via SCP
      run: |
        scp bot.py ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/ubuntu/bot-gemini/latestdepl

    # 4. Riavvia il servizio (es. systemd) per applicare le modifiche
    - name: Restart bot service
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          sudo systemctl restart mio-bot.service
        EOF
