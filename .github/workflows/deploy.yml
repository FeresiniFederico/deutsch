name: Deploy with Automatic Rollback

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Configura la chiave SSH
    - name: Setup SSH Key
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_KEY }}

    # 2. Aggiungi il server agli host conosciuti
    - name: Add remote to known_hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

    # 3. PASSO 1: Rinomina il bot corrente sul server in bot_rollback.py
    - name: Backup current bot on server
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd /home/ubuntu/bot-gemini
          if [ -f bot.py ]; then
            echo "📦 Rinomino il bot attuale in bot_rollback.py"
            mv bot.py bot_rollback.py
          fi
        EOF

    # 4. PASSO 2: Carica il nuovo bot.py via SCP
    - name: Upload new bot.py via SCP
      run: |
        scp bot.py ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/ubuntu/bot-gemini/

    # 5. PASSO 3 & 4: Test stabilità, pulizia o rollback in caso di errore
    - name: Test stability and handle Rollback if needed
      run: |
        ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd /home/ubuntu/bot-gemini
          echo "🔄 Riavvio del servizio con il nuovo bot..."
          sudo systemctl restart geminibot
          
          echo "⏳ Attendo 10 secondi per verificare la stabilità..."
          sleep 10
          
          if systemctl is-active --quiet mio-bot.service; then
            echo "✅ Il servizio è attivo e stabile!"
            echo "🧹 Rimuovo il file di backup (bot_rollback.py)..."
            rm -f bot_rollback.py
          else
            echo "❌ ERRORE: Il nuovo bot è crashato o non è partito!"
            echo "--- Ultimi log di errore ---"
            sudo journalctl -u geminibot -n 50 --no-pager
            
            echo "🔄 Avvio procedura di ROLLBACK..."
            # Elimina il nuovo bot fallito
            rm -f bot.py
            
            # Rinomina il backup facendolo tornare bot.py
            if [ -f bot_rollback.py ]; then
              mv bot_rollback.py bot.py
              echo "🔙 Vecchio bot ripristinato con successo."
            else
              echo "⚠️ Nessun backup trovato per il rollback!"
            fi
            
            echo "🔄 Riavvio del servizio con la versione precedente..."
            sudo systemctl restart geminibot
            
            # Fa fallire la GitHub Action
            exit 1
          fi
        EOF
